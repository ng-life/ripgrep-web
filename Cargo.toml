[package]
name = "ripgrep-web"
version = "0.0.2"
edition = "2021"
license = "MIT"
description = "A lightweight in-process ripgrep web log search service"

[dependencies]
axum = "0.7"
bzip2 = "0.6"
flate2 = "1"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
humantime = "2"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xz2 = "0.1"
zip = { version = "4", default-features = false, features = ["deflate", "bzip2", "zstd"] }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
